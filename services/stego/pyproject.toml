[project]
name = "stego-svc"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["pillow>=11.0", "numpy>=2.1", "scipy>=1.14", "fastapi>=0.115", "python-multipart>=0.0.9"]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx2>=0.1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stego_svc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
