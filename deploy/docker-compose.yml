# Stack del primer parcial (spec §4–§5): db, auth, stego y gateway. Cada servicio se agrega en su propia tarea del plan.
name: chat-seguro

x-python-service: &python-service
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  healthcheck:
    test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status != 200)"]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 10s

x-migrate: &migrate
  command: ["alembic", "upgrade", "head"]
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  networks: [data]
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password, db_auth_owner, db_auth_app, db_stego_owner, db_stego_app]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]  # lo mínimo del entrypoint de postgres
    security_opt: ["no-new-privileges:true"]
    networks: [data]
    restart: unless-stopped

  # stego guarda cada análisis en su BD y los archivos sospechosos en stego_quarantine (spec §23.7).
  stego:
    <<: *python-service
    build: {context: .., dockerfile: services/Dockerfile, args: {SERVICE: stego}}
    image: chat-seguro/stego
    environment:
      STEGO_QUARANTINE_DIR: /data
    secrets: [db_stego_app, svc_hash_gateway]
    volumes:
      - stego_quarantine:/data  # solo stego lo monta; ninguna ruta lo sirve
    networks: [apps, data]
    depends_on:
      stego-migrate: {condition: service_completed_successfully}

  stego-migrate:
    <<: *migrate
    build: {context: .., dockerfile: services/Dockerfile, args: {SERVICE: stego}}
    image: chat-seguro/stego
    secrets: [db_stego_owner]

  gateway:
    build: {context: .., dockerfile: gateway/Dockerfile}
    image: chat-seguro/gateway
    ports: ["80:80", "443:443"]
    secrets: [gateway_token_conf]
    volumes:
      - ./certs:/etc/nginx/certs:ro
    read_only: true
    tmpfs: ["/var/cache/nginx:size=128m", /var/run, /tmp]  # con tope: ahí van los cuerpos de 20 MB (R10)
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    networks:
      public: {}
      apps: {ipv4_address: 172.30.10.10}  # la única IP cuyo X-Forwarded-For creen los servicios (FND-6)
    restart: unless-stopped

networks:
  public: {}
  apps:
    internal: true
    ipam:
      # El gateway (GW-1) lleva la IP fija 172.30.10.10, la única en la que confían los servicios
      # para X-Forwarded-For (FORWARDED_ALLOW_IPS en services/Dockerfile). Las IP dinámicas salen
      # de ip_range, así que nadie más puede tomarla.
      config: [{subnet: 172.30.10.0/24, ip_range: 172.30.10.128/25}]
  data: {internal: true}

volumes:
  pgdata: {}
  stego_quarantine: {}

secrets:
  postgres_password: {file: ./secrets/postgres_password}
  db_auth_owner: {file: ./secrets/db_auth_owner}
  db_auth_app: {file: ./secrets/db_auth_app}
  db_stego_owner: {file: ./secrets/db_stego_owner}
  db_stego_app: {file: ./secrets/db_stego_app}
  jwt_signing_key: {file: ./secrets/jwt_signing_key}
  gateway_token_conf: {file: ./secrets/gateway_token.conf}
  svc_hash_gateway: {file: ./secrets/svc_hash_gateway}
