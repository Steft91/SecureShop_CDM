# Rutas sin sesión (login): se vacía la identidad para que el cliente no la inyecte (R16).
# El primer parcial no usa cookies (spec §23.1): no pasan a ningún servicio.
include /etc/nginx/snippets/proxy-base.conf;
proxy_set_header Cookie        "";
proxy_set_header X-User-Id     "";
proxy_set_header X-User-Name   "";
proxy_set_header X-Session-Id  "";
proxy_set_header X-User-Perms  "";
proxy_set_header Authorization "";
proxy_set_header X-Original-URI "";  # solo la subpetición la lleva
